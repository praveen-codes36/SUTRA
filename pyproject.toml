[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sutra"
version = "0.1.0"
description = "SUTRA — AI-Powered Institutional Email Intelligence Platform"
authors = [{ name = "SUTRA Team" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.0",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=3.0.0",
]
dev = [
    "pytest>=8.0.0",
]

